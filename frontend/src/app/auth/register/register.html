<div class="register-container">
  <h2>Crear Cuenta</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="nombre">Nombre completo</label>
      <input id="nombre" type="text" formControlName="nombre">
      <div *ngIf="registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched" style="color: red;">
        El nombre es obligatorio.
      </div>
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email">
      <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" style="color: red;">
        Introduce un email válido.
      </div>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password">
      <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" style="color: red;">
        La contraseña debe tener al menos 6 caracteres.
      </div>
    </div>

    <button type="submit" [disabled]="registerForm.invalid">Registrarse</button>
  </form>
</div>
