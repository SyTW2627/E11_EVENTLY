<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow duration-300 flex flex-col h-full relative cursor-pointer">
  
  <!-- Cabecera de la tarjeta: Deporte y Nivel -->
  <div class="px-5 py-4 border-b border-gray-50 flex justify-between items-start">
    <div>
      <span class="inline-block px-2.5 py-1 bg-green-50 text-green-700 text-xs font-semibold rounded-md uppercase tracking-wider mb-2">
        {{ deporte }}
      </span>
      <h3 class="font-bold text-gray-900 text-lg leading-tight">{{ titulo }}</h3>
    </div>
  </div>

  <!-- Cuerpo de la tarjeta: Detalles -->
  <div class="px-5 py-4 flex-grow flex flex-col gap-3">
    <!-- Fecha -->
    <div class="flex items-center text-sm text-gray-600">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      {{ fecha }}
    </div>
    <!-- Lugar -->
    <div class="flex items-center text-sm text-gray-600">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      {{ lugar }}
    </div>
    <!-- Nivel -->
    <div class="flex items-center text-sm text-gray-600">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
      Nivel: <span class="font-medium ml-1">{{ nivel }}</span>
    </div>
  </div>

  <!-- Pie de la tarjeta: Aforo y Acción (REQUISITO SCRUM-67) -->
  <div class="px-5 py-4 bg-gray-50 flex items-center justify-between mt-auto">
    
    <!-- Indicador de aforo dinámico -->
    <div class="flex items-center gap-2">
      @if (estaLleno) {
        <span class="flex h-3 w-3 rounded-full bg-red-500"></span>
        <span class="text-sm font-semibold text-red-600">¡Completo! ({{inscritos}}/{{aforoMaximo}})</span>
      } @else {
        <span class="flex h-3 w-3 rounded-full bg-green-500"></span>
        <span class="text-sm font-medium text-gray-700">{{inscritos}}/{{aforoMaximo}} apuntados</span>
      }
    </div>

    <!-- Botón -->
    <button [disabled]="estaLleno" 
            [class.opacity-50]="estaLleno"
            [class.cursor-not-allowed]="estaLleno"
            class="text-sm font-bold text-green-700 hover:text-green-800 transition-colors">
      Ver más
    </button>
  </div>
</div>
